name: Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux-x86_64-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install musl
        run: sudo apt update && sudo apt install -y musl-tools

      - name: Build static binary
        run: |
          musl-g++ -std=c++17 -O2 epubmaker.cpp -o epubmaker-linux-x86_64 -static
          chmod +x epubmaker-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: epubmaker-linux-x86_64
          path: epubmaker-linux-x86_64

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: linux-x86_64-static
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: epubmaker-linux-x86_64

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: epubmaker-linux-x86_64
